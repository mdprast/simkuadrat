<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Grid lines -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" stroke-dasharray="4,4">
    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
    
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="336" x2="416" y2="336" />
  </g>

  <!-- Axes -->
  <line x1="96" y1="290" x2="416" y2="290" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3.5" stroke-linecap="round" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Axis Arrows -->
  <polygon points="420,290 410,285 410,295" fill="rgba(255, 255, 255, 0.8)" />
  <polygon points="256,92 251,102 261,102" fill="rgba(255, 255, 255, 0.8)" />

  <!-- Axis Labels -->
  <text x="415" y="278" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="white">x</text>
  <text x="268" y="112" font-family="system-ui, sans-serif" font-weight="bold" font-size="20" fill="white">y</text>

  <!-- Symmetrical Axis of symmetry dashed line -->
  <line x1="256" y1="120" x2="256" y2="390" stroke="#fef08a" stroke-width="2" stroke-dasharray="6,4" opacity="0.7" />

  <!-- Parabola Curve y = a(x-h)^2 + k -->
  <!-- Vertex at (256, 380), opening upwards -->
  <path d="M 120,130 Q 256,440 392,130" fill="none" stroke="url(#curveGrad)" stroke-width="10" stroke-linecap="round" filter="url(#glow)" />

  <!-- Vertex point -->
  <circle cx="256" cy="362" r="10" fill="#ffffff" stroke="#ef4444" stroke-width="4" />

  <!-- Roots (intersection with x-axis at y=290) -->
  <!-- By quadratic geometry, x ~ 170 and 342 -->
  <circle cx="178" cy="290" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />
  <circle cx="334" cy="290" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="3" />

  <!-- Badge formula overlay at bottom -->
  <rect x="146" y="420" width="220" height="42" rx="21" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />
  <text x="256" y="447" font-family="system-ui, sans-serif" font-weight="700" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1">y = ax² + bx + c</text>
</svg>
